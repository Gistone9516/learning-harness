<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>learning-harness</title>
    <!--
      Generic host page (specs/web-notebook.md §5). Serves every subject: the views, labels and data
      come from the subject's content/app.json, the runtime config from local.config.js. Nothing in
      this file names a subject. Every URL is relative, so the page also works under a prefix such as
      /study/<slug>/ behind the gateway (specs/web-gateway.md); it must be opened at a URL ending in /.

      The saved theme is applied before the stylesheets so a light choice never flashes dark. The key
      is the kit's own lh:theme, which conceptprob also writes, so the two never disagree.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("lh:theme");
          if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          /* private mode: the OS preference stands */
        }
      })();
    </script>
    <link rel="stylesheet" href="kit/assets/index.css" />
    <link rel="stylesheet" href="host.css" />
  </head>
  <body>
    <nav class="lh-host-nav" id="lh-host-nav" aria-label="views" hidden></nav>
    <div id="app"></div>
    <!-- Runtime config, never bundled: the subject's host/local.config.js locally, generated without a token by the gateway. -->
    <script src="local.config.js"></script>
    <script src="host.js"></script>
  </body>
</html>
